name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # ⬅️ BU QATOR QO'SHILGAN BO'LISHI KERAK!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.6   # ⬅️ 8.6 GA O'ZGARTIRILGAN!
    
    - name: Clean and Refresh Dependencies
      run: gradle clean build --refresh-dependencies --stacktrace   # ⬅️ YANGI BUYRUK!
